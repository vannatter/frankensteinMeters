; Frankenstein Meters — flickering analog panel meters driven by ESP32s
;
; One firmware, multiple boards: each env bakes in a BOARD_ID which sets the
; board's static IP (192.168.68.(66+ID)) and hostname.
;
; Build/flash:  pio run -e board1 -t upload   (big meter bank, .67)
;               pio run -e board2 -t upload   (second board, .68)
; Monitor:      pio device monitor -p <port>

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps = fastled/FastLED@^3.7.0

[env:board1]
build_flags = -DBOARD_ID=1
upload_port = /dev/cu.usbserial-0001

[env:board2]
build_flags = -DBOARD_ID=2
upload_port = /dev/cu.usbserial-3

[env:board3]
build_flags = -DBOARD_ID=3
; lightning controller — set upload_port to its USB device when connected

; --- Wireless (OTA) flashing --------------------------------------------------
; Once a board has been USB-flashed with OTA firmware, reflash it over WiFi:
;   pio run -e board1_ota -t upload   (etc.)
; Resolves the board by mDNS hostname; password must match OTA_PASSWORD in code.
[env:board1_ota]
extends = env:board1
upload_protocol = espota
upload_port = frankenmeters-1.local
upload_flags = --auth=frankenlab

[env:board2_ota]
extends = env:board2
upload_protocol = espota
upload_port = frankenmeters-2.local
upload_flags = --auth=frankenlab

[env:board3_ota]
extends = env:board3
upload_protocol = espota
upload_port = frankenmeters-3.local
upload_flags = --auth=frankenlab
