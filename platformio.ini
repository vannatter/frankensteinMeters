; Frankenstein Meters — flickering analog panel meters driven by ESP32s
;
; One firmware, multiple boards: each env bakes in a BOARD_ID which sets the
; board's static IP (192.168.68.(66+ID)) and hostname.
;
; Build/flash:  pio run -e board1 -t upload   (big meter bank, .67)
;               pio run -e board2 -t upload   (second board, .68)
; Monitor:      pio device monitor -p <port>

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

[env:board1]
build_flags = -DBOARD_ID=1
upload_port = /dev/cu.usbserial-0001

[env:board2]
build_flags = -DBOARD_ID=2
upload_port = /dev/cu.usbserial-3
